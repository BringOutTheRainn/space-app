name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: TEMP print lockfile
        run: echo LOCKSTART; base64 -w0 package-lock.json; echo; echo LOCKEND
      - name: Build and run the rule tests
        run: npm test
      - name: Pacing simulation (three hours of play)
        run: node tools/simulate.mjs 3 3
